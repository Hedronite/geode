# rust-tops 1.0 instance — Hedronite/geode.
# Floor, not ceiling. Drop-in draft (66 lines) lost: sysdeps, honest MSRV,
# feature-matrix, artifact emptiness. This file is the proved instance.
#
# CI rustc = dtolnay/rust-toolchain@stable (latest stable).
# rust-tops.lock records the measured *dev* host (citadel rustc 1.98.0).
# Those are different numbers on purpose (G-CI7). Do not pretend they match.
#
# Sysdeps: fuser 0.15.1 build.rs probes fuse3 >= 3.0 then fuse >= 2.6 and
# unwraps. Ubuntu-latest ships neither. Install both packages on every job
# that enables the fuse feature. Live mount stays dark (S-01).
#
# NO RUSTFLAGS here. -D warnings lives on the clippy command only (RS-14).
# NO --fail-under-lines / --fail-above (S-04 record-only).
name: rust-tops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: sysdeps (fuse compiles under --all-features)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfuse3-dev libfuse-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: release build has no test trust root
        run: .github/scripts/check-no-test-trusted-root.sh
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: sysdeps (fuse compiles under --all-features)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfuse3-dev libfuse-dev
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Install nushell 0.116.1 (checksum-pinned)
        run: .github/scripts/install-nushell.sh
      - name: cargo nextest
        env:
          GEODE_REQUIRE_NU: "1"
        run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --doc --workspace --all-features

  msrv:
    # Honest floor = max rustc required by the LOCKED graph on this runner OS.
    # Linux keyring chain: keyring -> secret-service -> aes 0.9.3 => 1.89.
    # Darwin can pass 1.88; we declare the max over the shipped target set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: sysdeps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfuse3-dev libfuse-dev
      - run: cargo check --workspace --all-features --locked

  feature-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: geode-cli
            features: --no-default-features
          - package: geode-cli
            features: --features fuse
          - package: geode-tui
            features: --no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: sysdeps (fuse leg only)
        if: contains(matrix.features, 'fuse')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfuse3-dev libfuse-dev
      - run: cargo check -p ${{ matrix.package }} ${{ matrix.features }} --locked

  coverage-crap:
    # RECORD-ONLY (S-04). Artifacts must be non-empty. No floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: sysdeps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfuse3-dev libfuse-dev
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-crap@0.8.0
      - name: Install nushell 0.116.1 (checksum-pinned)
        run: .github/scripts/install-nushell.sh
      - env:
          GEODE_REQUIRE_NU: "1"
        run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --all-features \
            --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
      - run: |
          cargo crap --lcov target/coverage/lcov.info --format json --output target/crap.json
          test -s target/crap.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crap
          path: target/crap.json
          if-no-files-found: error

  # G1b floor on Arch. Not pin-macos. The Ubuntu jobs above stay.
  # archlinux has no GHA runner label; SPEC-gates uses this container.
  floor-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: bootstrap
        run: |
          pacman -Syu --noconfirm --needed git curl base-devel pkgconf fuse2 fuse3 ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - name: Install nushell 0.116.1 (checksum-pinned)
        run: .github/scripts/install-nushell.sh
      - name: cargo nextest
        run: |
          cargo install cargo-nextest --version 0.9.148 --locked
          GEODE_REQUIRE_NU=1 cargo nextest run --workspace --all-features --profile ci
      - name: doctests
        run: cargo test --doc --workspace --all-features
      - name: msrv 1.89.0
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-features --locked

  # G1b floor on macOS. This is not pin-macos. That job stays in ci.yml.
  # fuse stays off: macos-latest has no macFUSE, and the crate keeps fuse
  # off by default for that reason. The five floor commands still run.
  floor-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo nextest
        run: cargo nextest run --workspace --profile ci
      - name: doctests
        run: cargo test --doc --workspace
      - name: msrv 1.89.0
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --locked

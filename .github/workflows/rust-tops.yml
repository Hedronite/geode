name: rust-tops
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --doc --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  feature-matrix:
    strategy:
      matrix:
        include:
          - package: geode-cli
            features: --no-default-features
          - package: geode-cli
            features: --features fuse
          - package: geode-tui
            features: --no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ${{ matrix.package }} ${{ matrix.features }} --locked

  coverage-crap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --all-features --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/coverage/lcov.info
      - run: cargo install --locked cargo-crap && cargo crap --format json --lcov target/coverage/lcov.info --output target/crap.json
          test -s target/crap.json
      - uses: actions/upload-artifact@v4
        with:
          name: crap
          path: target/crap.json

# Core-profile lane: no --all-features. Does not compile fuse or the
# Linux keyring chain. rust-tops.yml is the real gate for those claims.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # SPEC-v033 G1: cosign v2.6.5, asset selected by uname, SHA-256 from
      # that release's cosign_checksums.txt. An unexpected checksum aborts
      # the install before the binary touches PATH.
      - name: Install cosign v2.6.5 (checksum-pinned)
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.6.5
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=cosign-linux-amd64; sum=c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644 ;;
            Linux-aarch64) asset=cosign-linux-arm64; sum=426193b4c5da4d4d643e822f48fe0cc8a476ca1782a272704831f5a0cef716d7 ;;
            Darwin-arm64) asset=cosign-darwin-arm64; sum=4d41cc18f0563907c0c785b51db76e1d1af10db4422b605ba876b1758e1771ab ;;
            Darwin-x86_64) asset=cosign-darwin-amd64; sum=0f8a1a70c81de9740a2b62e91307ff396ce54e7dd80568d42411bb2d9d44269c ;;
            *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}"
          echo "${sum}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign
          cosign version | grep -q "${COSIGN_VERSION}"
      - name: Install nushell 0.116.1 (checksum-pinned)
        run: .github/scripts/install-nushell.sh
      # `test-trusted-root` is off by default. geode-cli tests that pin a
      # user-owned helper need it; every other package stays on the default
      # feature set. A release build is checked separately and must not
      # contain the switch.
      - name: cargo test
        env:
          GEODE_REQUIRE_NU: "1"
        run: |
          # geode-tui's operator tests spawn target/debug/geode. Excluding
          # geode-cli from the workspace run skips that binary, so build
          # the default one first. The feature build is a later step.
          cargo build -p geode-cli --locked --bin geode
          cargo test --workspace --locked --exclude geode-cli
          cargo test -p geode-cli --locked --features test-trusted-root
      - name: release build has no test trust root
        run: .github/scripts/check-no-test-trusted-root.sh
      # SPEC-v033 G1 proof: `geode sign pub` / `geode sign blob` output is
      # exactly what cosign verify-blob consumes. Exit 0 under the signing
      # identity; non-zero under a second identity.
      - name: cosign verify-blob proof (geode sign)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/debug/geode
          W=$(mktemp -d)
          printf 'geode g1 gha payload\n' > "$W/payload"
          "$BIN" keygen --insecure-plaintext "$W/alice.gkey"
          "$BIN" keygen --insecure-plaintext "$W/bob.gkey"
          "$BIN" --key "$W/alice.gkey" sign pub -o "$W/pub.pem"
          "$BIN" --key "$W/alice.gkey" sign blob "$W/payload" -o "$W/sig"
          cosign verify-blob --key "$W/pub.pem" --signature "$W/sig" \
            --insecure-ignore-tlog --offline "$W/payload"
          "$BIN" --key "$W/bob.gkey" sign pub -o "$W/bob.pem"
          if cosign verify-blob --key "$W/bob.pem" --signature "$W/sig" \
              --insecure-ignore-tlog --offline "$W/payload"; then
            echo "cosign verified a signature under the wrong identity" >&2
            exit 1
          fi
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # One job, not the full matrix. Proves a pinned run of geode-pin-helper
  # under an injected trust root. A copied /bin/sh is SIGKILL'd:
  # CODESIGNING Launch Constraint Violation, platform id 26.
  # The ignored sudo test is the only root-owned install, and it fails
  # closed when `sudo -n` is missing.
  pin-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: trusted-path and run-path tests
        run: |
          cargo test -p geode-grotto --lib trusted_path --locked
          cargo test -p geode-os --lib pinned_non_platform_helper_runs --locked
          cargo test -p geode-os --lib macos_egress --locked
          cargo test -p geode-cli --test run_cli --locked --features test-trusted-root
      - name: sudo trusted-path (fails if sudo -n is missing)
        run: |
          set -eu
          cargo test -p geode-cli --test run_cli --locked --features test-trusted-root -- --ignored pinned_sudo_trusted_path_runs --exact --nocapture | tee /tmp/pin-sudo.out
          grep -q '1 passed' /tmp/pin-sudo.out
      # Not a gate. Castle saw exit 2 here; record whether macos-latest does too.
      - name: observe recipients_cli add_recipient_fail_closed
        continue-on-error: true
        run: cargo test -p geode-cli --test recipients_cli add_recipient_fail_closed --locked -- --nocapture

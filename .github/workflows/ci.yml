# Core-profile lane: no --all-features. Does not compile fuse or the
# Linux keyring chain. rust-tops.yml is the real gate for those claims.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # SPEC-v033 G1: cosign v2.6.5, asset selected by uname, SHA-256 from
      # that release's cosign_checksums.txt. An unexpected checksum aborts
      # the install before the binary touches PATH.
      - name: Install cosign v2.6.5 (checksum-pinned)
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.6.5
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=cosign-linux-amd64; sum=c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644 ;;
            Linux-aarch64) asset=cosign-linux-arm64; sum=426193b4c5da4d4d643e822f48fe0cc8a476ca1782a272704831f5a0cef716d7 ;;
            Darwin-arm64) asset=cosign-darwin-arm64; sum=4d41cc18f0563907c0c785b51db76e1d1af10db4422b605ba876b1758e1771ab ;;
            Darwin-x86_64) asset=cosign-darwin-amd64; sum=0f8a1a70c81de9740a2b62e91307ff396ce54e7dd80568d42411bb2d9d44269c ;;
            *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}"
          echo "${sum}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign
          cosign version | grep -q "${COSIGN_VERSION}"
      - name: cargo test
        run: cargo test --workspace --locked
      # SPEC-v033 G1 proof: `geode sign pub` / `geode sign blob` output is
      # exactly what cosign verify-blob consumes. Exit 0 under the signing
      # identity; non-zero under a second identity.
      - name: cosign verify-blob proof (geode sign)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/debug/geode
          W=$(mktemp -d)
          printf 'geode g1 gha payload\n' > "$W/payload"
          "$BIN" keygen "$W/alice.gkey"
          "$BIN" keygen "$W/bob.gkey"
          "$BIN" --key "$W/alice.gkey" sign pub -o "$W/pub.pem"
          "$BIN" --key "$W/alice.gkey" sign blob "$W/payload" -o "$W/sig"
          cosign verify-blob --key "$W/pub.pem" --signature "$W/sig" \
            --insecure-ignore-tlog --offline "$W/payload"
          "$BIN" --key "$W/bob.gkey" sign pub -o "$W/bob.pem"
          if cosign verify-blob --key "$W/bob.pem" --signature "$W/sig" \
              --insecure-ignore-tlog --offline "$W/payload"; then
            echo "cosign verified a signature under the wrong identity" >&2
            exit 1
          fi
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

[package]
name = "geode-core"
description = "GDE1 format, crypto, vault, and policy evaluate - the Geode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geode_core"
path = "src/lib.rs"

[features]
# No default features. v0.1 ships `core` only. tui/fuse/pq are later adapters
# and MUST NOT be default-on (SPEC-v010 G0, 14-tui 2).
default = []

[dependencies]
# G1: real crypto deps.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1"
aegis = "0.9"
argon2 = "0.6"
getrandom = "0.3"

[lints]
workspace = true

[package]
name = "geode-grotto"
description = "GDE1 custody core (format, crypto, vault, policy, keyring) - the Geode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lib]
name = "geode_grotto"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1"
aegis = "0.9"
argon2 = "0.6"
getrandom = "0.3"
subtle = "2"
base64ct = { version = "1", features = ["alloc"] }
# G0a (v0.2.1): HCTR2-256 length-preserving filename seal (02-cryptography 5).
# HCTR2 mode is wired in `src/hctr2.rs` from `aes` + `polyval` (the published
# `hctr2` crate needs nightly). `data-encoding` provides the
# base32hex (RFC 4648, lowercase, no padding) name encoding.
aes = "0.8"
cipher = "0.4"
polyval = "0.7"
data-encoding = "2"
# G1a (v0.2.0): OS keyring storage for ISK / wrap passphrase. Default v1
# feature pulls the platform-native store (Keychain on macOS, Credential
# Manager on Windows, Secret Service on Linux). When no store is available
# at runtime (e.g. CI without a D-Bus secret service) callers fall back to
# a 0600 file via keyring::store_secret_file.
keyring = "4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

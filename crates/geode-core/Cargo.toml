[package]
name = "geode-grotto"
description = "GDE1 custody core (format, crypto, vault, policy, keyring) - the Geode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lib]
name = "geode_grotto"
path = "src/lib.rs"

[features]
default = []
# Test-only and insecure. Off unless a build asks for it. Exposes
# `plan_with_test_root`, which moves the pin trust root. The crate
# refuses to compile this feature only when debug assertions are off
# (`cargo build --release`, `cargo install`). A dev or test build can
# still enable it. That is not a release guarantee. Release builds of
# `geode` do not enable it.
test-trusted-root = []

[dependencies]
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1"
aegis = "0.9"
argon2 = "0.6"
getrandom = "0.3"
subtle = "2"
base64ct = { version = "1", features = ["alloc"] }
# G0 (v0.2.2): SHA-256 for truncated-read digest (06-agent-plane 4).
sha2 = "0.10"
# G0a (v0.2.1): HCTR2-256 length-preserving filename seal (02-cryptography 5).
# HCTR2 mode is wired in `src/hctr2.rs` from `aes` + `polyval` (the published
# `hctr2` crate needs nightly). `data-encoding` provides the
# base32hex (RFC 4648, lowercase, no padding) name encoding.
aes = "0.8"
cipher = "0.4"
polyval = "0.7"
data-encoding = "2"
# G0 (v0.2.6): X25519 recipient wrap/unwrap (02-cryptography 7.2).
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# G0 (v033): the Ed25519 identity child behind the `geode sign` cosign verb.
# It signs raw payload bytes (RFC 8032, no prehash) in `src/sign.rs`; that
# module frames the SPKI PEM by hand, so no pkcs8/spki feature is needed here.
# `zeroize` (already a default) is named for the contract: it makes the
# `SigningKey` zeroize on drop.
ed25519-dalek = { version = "2", features = ["zeroize"] }

# G1a (v0.2.0): OS keyring storage for ISK / wrap passphrase. Default v1
# feature pulls the platform-native store (Keychain on macOS, Credential
# Manager on Windows, Secret Service on Linux). When no store is available
# at runtime (e.g. CI without a D-Bus secret service) callers fall back to
# a 0600 file via keyring::store_secret_file.
keyring = "4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# G6 (v034): named redaction for `inject::plan` and its output collector.
geode-redact = { version = "2.0.0", path = "../geode-redact" }
# Fix 4: `O_NOFOLLOW` for the pinned `allow_cmds` open in `inject.rs`.
# Constants only; this crate still forbids unsafe.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true

[package]
name = "geode-core"
description = "GDE1 format, crypto, vault, and policy evaluate - the Geode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geode_core"
path = "src/lib.rs"

[features]
# No default features. v0.1 ships `core` only. tui/fuse/pq are later adapters
# and MUST NOT be default-on (SPEC-v010 G0, 14-tui 2).
default = []

[dependencies]
# G0b: only deps actually referenced by stubs. Crypto crates (aegis, blake3,
# argon2, hctr2, x25519-dalek, ed25519-dalek, hkdf, sha2, getrandom,
# data-encoding) land with G1/G2 when the stubs become real implementations.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true

[package]
name = "geode-core"
description = "GDE1 format, crypto, vault, and policy evaluate - the Geode API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geode_core"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1"
aegis = "0.9"
argon2 = "0.6"
getrandom = "0.3"
subtle = "2"
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package]
name = "geode-tui"
description = "geode tui — Ratatui operator surface over geode-grotto (spec 14-tui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lib]
name = "geode_tui"
path = "src/lib.rs"

[features]
default = ["tui"]
# 14-tui 2.2: default-on for release builds; a core-profile build
# (--no-default-features) compiles with no ratatui and answers
# `geode tui` with exit 1. All read-side deps (rpassword/zeroize/
# serde_json/blake3) are pulled in only with `tui` so a core build
# stays lean and `geode-grotto` never depends on ratatui.
tui = ["dep:ratatui", "dep:crossterm", "dep:rpassword", "dep:zeroize", "dep:serde_json", "dep:blake3"]

[dependencies]
geode-grotto = { version = "0.2.2", path = "../geode-core" }

[dependencies.ratatui]
version = "0.30"
default-features = false
features = ["crossterm"]
optional = true

[dependencies.crossterm]
version = "0.29"
optional = true

[dependencies.rpassword]
version = "7"
optional = true

[dependencies.zeroize]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.blake3]
version = "1"
optional = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

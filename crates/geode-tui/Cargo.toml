[package]
name = "geode-tui"
description = "geode tui — Ratatui operator surface over geode-grotto (spec 14-tui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geode_tui"
path = "src/lib.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
geode-grotto = { path = "../geode-core" }

[dependencies.ratatui]
version = "0.30"
default-features = false
features = ["crossterm"]
optional = true

[dependencies.crossterm]
version = "0.29"
optional = true

[lints]
workspace = true

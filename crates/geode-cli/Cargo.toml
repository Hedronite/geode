[package]
name = "geode-cli"
description = "geode — Hedronite custody plane CLI (adapter over geode-grotto)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "geode"
path = "src/main.rs"

[features]
default = ["tui"]
# 14-tui 2.2: default-on for release builds; a core-profile build
# (--no-default-features) compiles with no ratatui and answers
# `geode tui` with exit 1.
tui = ["dep:geode-tui"]
# Linux FUSE and Darwin FUSE-T / macFUSE (08-mount 2). Off by default so
# Darwin and GHA cargo test stay green without a driver or /dev/fuse.
# fuser stays out of geode-grotto. A missing Darwin driver exits 1.
fuse = ["dep:fuser"]

[dependencies]
geode-grotto = { version = "1.2.1", path = "../geode-core" }
geode-tui = { version = "1.2.1", path = "../geode-tui", optional = true }
# G6 (v034): the only spawn path for `geode run`.
geode-os = { version = "1.2.1", path = "../geode-os" }
# geode scan: the pure scanner lives in geode-redact.
geode-redact = { version = "1.2.1", path = "../geode-redact" }
secrecy = "0.10"
fuser = { version = "0.15.1", optional = true }
blake3 = "1"
base64ct = { version = "1", features = ["alloc"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
serde_json = "1"
walkdir = "2"
zeroize = "1"
rpassword = "7"


[dev-dependencies]
tempfile = "3"
# G6 (v034): read audit rows in run tests.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_yaml = "0.9"
blake3 = "1"
# Pin tests hash the fixture binary. Same crate and major as geode-grotto.
sha2 = "0.10"

[lints]
workspace = true

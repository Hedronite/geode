[package]
name = "geode-cli"
description = "geode — Hedronite custody plane CLI (adapter over geode-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "geode"
path = "src/main.rs"

[dependencies]
geode-grotto = { path = "../geode-core" }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
serde_json = "1"
walkdir = "2"
zeroize = "1"
rpassword = "7"


[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
